<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>早押しクイズ</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="join-screen" class="screen">
  <h1>早押しクイズ</h1>
  <div class="card">
    <div class="role-select">
      <button id="role-player" class="role-btn active" data-role="player">プレイヤーとして参加</button>
      <button id="role-host" class="role-btn" data-role="host">出題者として参加</button>
    </div>
    <input id="name-input" type="text" placeholder="なまえを入力" maxlength="20" />
    <button id="join-btn">参加する</button>
  </div>
</div>

<div id="player-screen" class="screen hidden">
  <div id="question-display" class="question-display hidden"></div>
  <div id="status-banner" class="status-banner idle">出題を待っています…</div>
  <button id="buzz-btn" class="buzz-btn" disabled>押す！</button>
  <h2>プレイヤー一覧</h2>
  <ul id="player-list" class="player-list"></ul>
</div>

<div id="host-screen" class="screen hidden">
  <h1>出題者パネル</h1>
  <div class="mode-select">
    <button id="mode-manual" class="mode-btn active" data-mode="manual">手動入力</button>
    <button id="mode-auto" class="mode-btn" data-mode="auto">自動出題</button>
  </div>

  <div id="difficulty-select" class="difficulty-select hidden">
    <p class="difficulty-select-label">難易度を選んでスタートしてください</p>
    <div class="difficulty-btns">
      <button class="difficulty-btn active" data-difficulty="A">A（かんたん）</button>
      <button class="difficulty-btn" data-difficulty="B">B（ふつう）</button>
      <button class="difficulty-btn" data-difficulty="C">C（むずかしい）</button>
    </div>
    <button id="start-auto-btn">この難易度でスタート</button>
  </div>

  <div id="auto-session-info" class="auto-session-info hidden">
    自動出題中：難易度 <span id="current-difficulty-label"></span>
    <button id="change-difficulty-btn">難易度を変更</button>
  </div>

  <textarea id="question-input" class="question-input" placeholder="問題文を入力…" maxlength="300" rows="3"></textarea>
  <div id="auto-mode-hint" class="auto-mode-hint hidden">「問題を出す」を押すと選んだ難易度の問題からランダムに出題します（全問出題し終えたら1周してリセットされます）</div>
  <div id="host-question-display" class="question-display hidden"></div>
  <div id="host-answer-display" class="answer-display hidden"></div>
  <div id="host-status" class="status-banner idle">待機中</div>
  <div id="host-controls" class="host-controls">
    <button id="open-btn">問題を出す</button>
    <button id="correct-btn" disabled>正解</button>
    <button id="wrong-btn" disabled>不正解</button>
    <button id="reset-btn">リセット</button>
  </div>
  <h2>プレイヤー一覧</h2>
  <ul id="host-player-list" class="player-list"></ul>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
