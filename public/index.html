<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>はやトレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="join-screen" class="screen">
  <h1 class="app-title"><span>早押しクイズ</span><span>トレーニング</span></h1>
  <div class="card">
    <input id="name-input" type="text" placeholder="なまえを入力" maxlength="20" />
    <div class="mode-select">
      <button id="mode-training-btn" class="mode-btn mode-btn-training">
        <span class="mode-btn-title">トレーニングモード</span>
        <span class="mode-btn-desc">CPU相手にひとりで練習</span>
      </button>
      <button id="mode-friend-btn" class="mode-btn mode-btn-friend">
        <span class="mode-btn-title">フレンド対戦モード</span>
        <span class="mode-btn-desc">友達と早押し対戦</span>
      </button>
    </div>
  </div>
</div>

<div id="game-screen" class="screen game-screen hidden">
  <div id="top-bar" class="top-bar">
    <button id="back-to-mode-btn" class="back-btn">← モード選択</button>
    <span id="question-number-badge" class="question-number-badge hidden"></span>
    <button id="end-game-btn" class="hidden">終了</button>
  </div>

  <header id="player-bar" class="player-bar">
    <ul id="player-list" class="player-list"></ul>
  </header>

  <div class="game-body">
    <h1 id="game-title">早押しクイズトレーニング</h1>

    <div id="setup-panel" class="setup-panel">
      <p class="setup-label">難易度を選んでください</p>
      <div class="difficulty-btns">
        <button class="difficulty-btn" data-difficulty="C">C<span class="difficulty-label">（かんたん）</span></button>
        <button class="difficulty-btn active" data-difficulty="B">B<span class="difficulty-label">（ふつう）</span></button>
        <button class="difficulty-btn" data-difficulty="A">A<span class="difficulty-label">（むずかしい）</span></button>
      </div>
      <label class="cpu-toggle">
        <input type="checkbox" id="cpu-toggle-checkbox" />
        CPU対戦相手を参加させる
      </label>
      <div class="room-settings">
        <label class="setting-field">
          先取点数
          <input type="number" id="win-score-input" min="0" max="99" placeholder="制限なし" />
        </label>
        <label class="setting-field">
          出題数上限
          <input type="number" id="question-limit-input" min="0" max="99" placeholder="制限なし" />
        </label>
      </div>
      <button id="start-game-btn">ゲーム開始</button>
    </div>

    <div id="play-panel" class="play-panel hidden">
      <div class="stage">
        <div id="question-number" class="question-number"></div>
        <div id="question-display" class="question-display"></div>
        <span id="answer-reveal-label" class="answer-reveal-label hidden">
          <span id="answer-reveal-answer" class="answer-reveal-answer"></span>
          <span id="answer-reveal-input" class="answer-reveal-input"></span>
        </span>
      </div>

      <div id="status-banner" class="status-banner"></div>

      <button id="buzz-btn" class="buzz-btn" disabled>押す！</button>
    </div>
  </div>

  <div id="buzz-overlay" class="buzz-overlay hidden">
    <div class="buzz-card">
      <div id="buzz-live" class="buzz-live">
        <div class="buzz-card-header">
          <span id="buzz-avatar" class="player-avatar"></span>
          <span id="buzz-card-status" class="buzz-card-status"></span>
          <span id="letter-timer" class="letter-timer"></span>
        </div>
        <div class="answer-progress-row">
          <span class="answer-progress-label">解答</span>
          <span id="answer-progress-text" class="answer-progress-text"></span>
        </div>
        <div id="choices" class="choices hidden">
          <button class="choice-btn" data-index="0"></button>
          <button class="choice-btn" data-index="1"></button>
          <button class="choice-btn" data-index="2"></button>
          <button class="choice-btn" data-index="3"></button>
        </div>
      </div>

      <div id="wrong-result" class="wrong-result hidden">
        <div class="wrong-result-badge">
          <span class="wrong-result-icon">✕</span>
          <span class="wrong-result-label">不正解</span>
        </div>
        <div id="wrong-result-letter" class="wrong-result-letter"></div>
      </div>

      <div id="correct-result" class="correct-result hidden">
        <div class="correct-result-badge">
          <span class="correct-result-icon">○</span>
          <span class="correct-result-label">正解</span>
        </div>
        <div id="correct-result-letter" class="correct-result-letter"></div>
      </div>
    </div>
  </div>

  <div id="game-over-overlay" class="buzz-overlay hidden">
    <div class="buzz-card game-over-card">
      <p class="game-over-title">ゲーム終了！</p>
      <ul id="game-over-ranking" class="game-over-ranking"></ul>
      <button id="game-over-close-btn" class="end-confirm-ok">閉じる</button>
    </div>
  </div>

  <div id="end-confirm-overlay" class="buzz-overlay hidden">
    <div class="buzz-card end-confirm-card">
      <p class="end-confirm-message">ゲームを終了しますか？</p>
      <div class="end-confirm-actions">
        <button id="end-confirm-cancel" class="end-confirm-cancel">キャンセル</button>
        <button id="end-confirm-ok" class="end-confirm-ok">終了する</button>
      </div>
    </div>
  </div>

  <div id="leave-confirm-overlay" class="buzz-overlay hidden">
    <div class="buzz-card end-confirm-card">
      <p class="end-confirm-message">モード選択に戻りますか？<br />現在の対戦は終了します。</p>
      <div class="end-confirm-actions">
        <button id="leave-confirm-cancel" class="end-confirm-cancel">キャンセル</button>
        <button id="leave-confirm-ok" class="end-confirm-ok">戻る</button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
